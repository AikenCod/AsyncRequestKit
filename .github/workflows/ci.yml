name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swift-test:
    name: Swift 6 on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: swift --version
      - run: swift package dump-package
      - run: Scripts/validate_linux_imports.sh
      - run: Scripts/test_spm_consumer.sh
      - run: swift test

  pod-lint:
    name: CocoaPods lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: Scripts/validate_repository_metadata.sh
