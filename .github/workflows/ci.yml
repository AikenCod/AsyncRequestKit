name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swift-test:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            swift: "6.0"
          - os: ubuntu-24.04
            swift: "6.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: swift-actions/setup-swift@65540b95f51493d65f5e59e97dcef9629ddf11bf
        with:
          swift-version: ${{ matrix.swift }}
      - run: swift --version
      - run: swift package dump-package
      - run: Scripts/validate_linux_imports.sh
      - run: swift test

  pod-lint:
    name: CocoaPods lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: pod lib lint AsyncRequestKit.podspec --quick --allow-warnings --skip-tests
